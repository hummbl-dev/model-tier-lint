[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-tier-lint"
version = "0.1.0"
description = "Validate and lint model-tier catalogs (MD/YAML) against a schema"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
model-tier-lint = "model_tier_lint.cli:main"

[tool.setuptools]
packages = ["model_tier_lint"]
